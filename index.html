<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#26201a" />
    <title>Changemakers Summit — Aniwa · October 23–25, 2026</title>
    <meta
      name="description"
      content="The Aniwa Changemakers Summit — a private, by-invitation gathering where Indigenous wisdom keepers meet frontier-technology builders. October 23–25, 2026, Northern California."
    />
    <link rel="icon" type="image/webp" href="/assets/aniwa-logo.webp" />
    <link rel="preload" as="image" href="/assets/compass/compass.svg" fetchpriority="high" />
    <script async src="https://widgets.givebutter.com/latest.umd.cjs?acct=q5TCBcijePWQ6jsd&p=other"></script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Hidden static form so Netlify Forms detects "registrations" and can
         email the team on each submission (forwarded server-side by the
         register function). Not rendered — display:none. -->
    <form name="registrations" data-netlify="true" netlify-honeypot="bot-field" hidden style="display: none">
      <input type="hidden" name="form-name" value="registrations" />
      <input name="bot-field" />
      <input name="invite-code" /><input name="assigned-by" />
      <input name="fullName" /><input name="email" /><input name="phone" />
      <input name="organization" /><input name="role" /><input name="location" />
      <input name="industry" /><textarea name="expertise"></textarea>
      <input name="linkedin" /><input name="instagram" /><input name="x" /><input name="website" />
      <input name="publicDirectory" /><input name="submittedAt" /><input name="id" /><input name="code" />
    </form>
    <!-- Hidden static form so Netlify Forms detects "applications" (the
         open application at #/apply — no invite code required). -->
    <form name="applications" data-netlify="true" netlify-honeypot="bot-field" hidden style="display: none">
      <input type="hidden" name="form-name" value="applications" />
      <input name="bot-field" />
      <input name="name" /><input name="email" /><input name="linkedin" />
      <input name="organization" /><input name="title" />
      <textarea name="about"></textarea>
      <textarea name="whyJoin"></textarea>
      <textarea name="contribution"></textarea>
      <input name="donationReady" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
